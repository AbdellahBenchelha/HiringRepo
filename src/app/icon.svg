<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="WorkRoute">
  <!-- Indigo tile keeps the mark legible on both light and dark browser tab bars. -->
  <rect width="64" height="64" rx="15" fill="#0f1035"/>
  <!-- Strokes are deliberately heavy: fine detail disappears at 16px. -->
  <path d="M15 44 L24 35" fill="none" stroke="#fbcb4d" stroke-width="7" stroke-linecap="round"/>
  <path d="M24 35 L30 41 L43 27" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="19.5" r="4.9" fill="#f5a623"/>
</svg>
